<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Momo lens demo: a three minute calm-down session before a job interview." />
    <meta name="mrbd-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="preload" href="/fonts/elms-sans-latin-v1.woff2" as="font" type="font/woff2" crossorigin />
    <title>Momo</title>
    <script>
      // Phone-browser preview: fit the 600×600 lens to a smaller screen before first layout
      // (main.ts keeps it updated on rotation). Glasses and desktop screens are ≥ 600: no change.
      (() => {
        const fit = Math.min(1, screen.width / 600, screen.height / 600);
        if (fit < 1) {
          document.documentElement.classList.add('phone');
          document.documentElement.style.setProperty('--fit', fit.toFixed(4));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <canvas id="lens" class="lens" width="600" height="600" aria-hidden="true"></canvas>
      <button id="hit" class="hit" type="button" aria-label="Start Momo session" autofocus></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
